{% extends "base.html"%}

{% block content %}
     <h1>All categories:</h1>

        <ol>
            {% for category in all_categories %}
                <li><a href="/categories/{{category.category_id}}/"> {{category.category_name}}</a></li>
            {% endfor %}

        </ol>

        <a class = 'accountItem' href="{% url 'create_category'%}">Create category </a>

    {% endblock content %}
